name: Libft CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up C Environment
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Set up Python for Norminette
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Linter (Norminette)
        run: |
          python -m pip install --upgrade pip
          pip install norminette
          norminette .

      - name: Run unit tests
        run: make test

  # --- NEW PHASE 3: CD EXTENSION ---
  deploy:
    needs: build-and-test
    # This condition ensures deployment ONLY runs if the push is to the main branch (i.e., when a PR is merged)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Libft Binary
        run: make

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libft-archive
          path: libft.a